# Template only. Confirm certificate paths and filesystem permissions before
# copying this file into /etc/nginx/conf.d/ and running nginx -t.

server {
    listen 443 ssl;
    http2 on;
    server_name portal.skygem.ai;

    ssl_certificate     /etc/letsencrypt/live/portal.skygem.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.skygem.ai/privkey.pem;

    root /opt/skygem/platform/apps/portal/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.skygem.ai;

    ssl_certificate     /etc/letsencrypt/live/api.skygem.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.skygem.ai/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
